# Volume bridge configuration.
#
# AirPlay volume <-> amplifier volume, both directions:
#   * moving the volume slider on an AirPlay source sets the amplifier;
#   * changing the volume on the amplifier moves the slider on the source.

[bridge]
log_level = "INFO"            # DEBUG shows every echo the bridge ignores
# After pushing a volume to the source, ignore volume reports from the source
# for this long (it ramps and echoes intermediate values).
source_echo_window = 1.5
# After commanding the amplifier, ignore its reports for this long.
amplifier_echo_window = 1.0
# Each report with a new value (e.g. an amp streaming status while it ramps)
# restarts the window above, but never past this many seconds in total.
max_echo_window = 10.0
# If the amplifier backend supports mute: AirPlay mute (slider at the bottom)
# mutes the amplifier, and muting on the amplifier mutes on the source.
use_amplifier_mute = true

[shairport]
bus = "system"                # "system", "session", or a D-Bus address
service = "org.gnome.ShairportSync"
# UDP port for Shairport Sync's metadata (metadata.socket_port in
# shairport-sync.conf); tells the bridge when a source connects/disconnects.
metadata_port = 5555

[amplifier]
# "stub", "tcp-serial", or "your.module:YourAmplifierClass"
type = "stub"

# The amplifier's own volume scale. AirPlay's slider (0..100%) maps linearly
# onto min_level..max_level, rounded to `step`.
[amplifier.scale]
min_level = 0
max_level = 100
step = 1
# Never send a level above this (safety ceiling). Defaults to max_level.
# limit = 70
# 1.0 = linear in slider position (right for amps with a dB scale).
# >1.0 gives finer control at low volume for amps with a linear/percent scale.
exponent = 1.0

# Backend-specific options.
[amplifier.options]
initial_level = 20
# Simulated front panel: `nc <docker-host> 7001`, then e.g. "set 35", "up", "mute on".
control_port = 7001

# ---------------------------------------------------------------------------
# Example: an amplifier on a serial-to-Ethernet adapter (e.g. ser2net in raw
# mode) or a serial multiplexer. Replace the [amplifier] sections above with
# something like this, adjusted to your amplifier's manual.
#
# [amplifier]
# type = "tcp-serial"
#
# [amplifier.scale]
# min_level = 0
# max_level = 98
# step = 1
# limit = 70
#
# [amplifier.options]
# host = "192.168.1.50"
# port = 4001
#
# # --- Framing: how messages are separated in the received byte stream ---
# # "delimited": messages end in any of receive_terminators (CR/LF lines, ";" ...)
# # "fixed":     every message is frame_length bytes
# # "markers":   start_marker ... end_marker [+ trailer_length bytes, e.g. checksum]
# # "stream":    no delimiters at all; messages are found by scanning the stream
# #              for level_pattern / mute_pattern / ignore_patterns
# framing = "delimited"
# receive_terminators = "\r\n"
# # frame_length = 6
# # start_marker = "\u0002"
# # end_marker = "\u0003"
# # trailer_length = 1
# # frame_gap = 0.05          # silence that completes/abandons a partial message
# # encoding = "latin-1"      # one character per byte, for binary protocols
#
# # --- Commands ---
# command_prefix = ""
# command_suffix = "\r"       # use "" for protocols without terminators
# set_level_command = "MV{level_int:02d}"   # also {level}, {level_chr} (raw byte)
# query_commands = ["MV?", "MU?"]
# mute_on_command = "MUON"
# mute_off_command = "MUOFF"
#
# # --- Status in received messages ---
# level_pattern = 'MV(?P<level>\d{2})'
# level_encoding = "decimal"  # or "hex", or "byte" for a raw binary value
# mute_pattern = 'MU(?P<muted>ON|OFF)'
# # Optional, for hooks' if_amplifier_off: how to ask whether the amp is on.
# # power_query_command = "PW?"
# # power_pattern = 'PW(?P<power>ON|STANDBY)'
# # power_on_values = ["ON"]
# # "full": a pattern must match a whole message (guards against fragments);
# # "search": it may match anywhere in it (e.g. "@MAIN:VOL=-30,MUTE=Off").
# match = "full"
#
# # Amps that push status when the knob/remote is used need no polling.
# poll_interval = 0           # seconds; use only if the amp doesn't push changes
# command_interval = 0.05
#
# # --- Shared port / serial multiplexer (several programs on one RS-232 port) ---
# # true if the multiplexer echoes our own commands back to us.
# own_commands_echoed = false
# # Messages from other programs that would match the patterns above but are
# # commands, not status (not needed when commands and status differ).
# ignore_patterns = []

# ---------------------------------------------------------------------------
# Hooks: actions run when a source connects/disconnects or playback starts/ends,
# e.g. to wake equipment that went to standby. Events:
#   on_connect        a source (phone, Mac...) connects to this speaker
#   on_disconnect     the last source disconnects
#   on_session_start  playback starts (Shairport Sync's "active" state)
#   on_session_end    active_state_timeout after playback stops
# Actions run in order; a failing action is logged and the next one still runs:
#   { send = "PWR 1" }               a command through the amplifier connection,
#                                    wrapped in command_prefix/command_suffix
#   { send = "\u0002ON\u0003", raw = true }   sent byte for byte (e.g. another
#                                    device on a shared serial port)
#   { shell = "...", timeout = 30 }  run with /bin/sh -c. Environment:
#                                    VOLUME_BRIDGE_EVENT, VOLUME_BRIDGE_SOURCE,
#                                    VOLUME_BRIDGE_AIRPLAY_VOLUME,
#                                    VOLUME_BRIDGE_AMPLIFIER_LEVEL,
#                                    VOLUME_BRIDGE_AMPLIFIER_MUTED, plus the
#                                    container's environment (e.g. HA_TOKEN)
#   { delay = 3 }                    wait (e.g. while equipment powers up)
#   { sync = "source" }              re-read the amplifier, then send the
#                                    source's volume to it ("amplifier": the
#                                    other way round). Until the first sync of
#                                    an event, volume sync is held in both
#                                    directions (the amp may still be waking)
#   { parallel = [ A, [B, C] ] }     run branches at the same time and wait
#                                    for all; a branch is one action or a list
#                                    of actions run in order
#   { if_amplifier_off = [A, B] }    run A, B only if the amplifier says it is
#                                    off (e.g. power on + warm-up delay). Needs
#                                    power_query_command and power_pattern in
#                                    [amplifier.options]; if the state is
#                                    unknown, the actions run anyway
#
# [hooks]
# on_connect = [
#   # Home Assistant: turn on a smart plug / script. HA_TOKEN is a long-lived
#   # access token passed in docker-compose.yaml's environment.
#   { shell = 'curl -sf -X POST -H "Authorization: Bearer $HA_TOKEN" -H "Content-Type: application/json" -d "{\"entity_id\": \"switch.amplifier\"}" http://192.168.1.10:8123/api/services/switch/turn_on' },
#   { delay = 5 },
#   { sync = "source" },
# ]
# on_session_end = [
#   { shell = "/opt/hooks/idle.sh" },   # scripts mounted into the container
# ]
