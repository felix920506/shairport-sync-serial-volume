// Shairport Sync configuration for a "bit-transparent" AirPlay 2 receiver.
//
// Goals:
//   * AirPlay 2 (multi-room) via NQPTP.
//   * Decoded PCM goes straight to an ALSA device: no software volume, no
//     hardware mixer, no resampling, no mixdown, no DSP.
//   * The AirPlay volume is NOT applied to the audio. It is still tracked and
//     published on D-Bus, where the volume bridge forwards it to the amplifier.
//
// See https://github.com/mikebrady/shairport-sync/blob/development/scripts/shairport-sync.conf
// for every available setting.

general =
{
	name = "%H"; // Service name shown on AirPlay sources. "%H" = hostname. Override with SPS_NAME / --name.
	output_backend = "alsa";
	mdns_backend = "avahi";

	// The source's volume slider stays visible and working, but the audio is
	// always passed at full scale (0 dB, no attenuation, no dither).
	ignore_volume_control = "yes";

	// Shown on the source as an absolute volume control.
	volume_control_type = 3;

	// Multi-room sync needs *some* way to correct clock drift between this
	// device's DAC and the AirPlay timeline. "vernier" recodes the packets it
	// corrects to slightly more or fewer frames, smoothly. "basic" would leave
	// samples untouched but cut or double single frames, which crackles audibly,
	// especially while a session's timing settles (hundreds of frames in a few
	// seconds). Set alsa.disable_synchronization = "yes" if you don't need tight
	// sync and want untouched sample streams.
	interpolation = "vernier";

	// Don't fold multichannel streams down to stereo; pass through what arrives
	// (as long as the ALSA device supports that channel count).
	mixdown = "off";

	// The container runs its own private D-Bus system bus.
	dbus_service_bus = "system";
};

sessioncontrol =
{
	// Allow a new source to take over from an existing one.
	allow_session_interruption = "yes";

	// The volume bridge only pushes amplifier-side volume changes to the
	// source while Shairport Sync is "active". Keep it active through pauses
	// (default is 10 seconds after play stops).
	active_state_timeout = 900.0;

	// Don't exit when the DAC is missing (a USB DAC that is off or still
	// starting up): log it and keep retrying to open it while playing.
	run_this_if_an_unfixable_error_is_detected = "/usr/local/bin/output-device-error";
};

alsa =
{
	// Set this to your card, e.g. "hw:0", "hw:CARD=DAC" or "iec958:CARD=..".
	// Use "hw:" (not "plughw:"/"default") to avoid ALSA's plug layer doing
	// format/rate conversion behind your back.
	// Override at runtime with the ALSA_DEVICE environment variable.
	output_device = "hw:0";

	// No mixer_control_name: Shairport Sync must never touch the hardware mixer.

	// "auto" lets Shairport Sync pick the rate/format/channels that match the
	// incoming stream exactly when the hardware supports it (44.1k/48k,
	// 16/24/32-bit) so no conversion happens.
	output_rate = "auto";
	output_format = "auto";
	output_channels = "auto";
};

metadata =
{
	// Required for the D-Bus interface to report volume changes.
	enabled = "yes";
	include_cover_art = "no";

	// The volume bridge listens here for "a source connected/disconnected"
	// messages, which aren't on D-Bus. Must match [shairport] metadata_port
	// in the bridge config.
	socket_address = "127.0.0.1";
	socket_port = 5555;
};
