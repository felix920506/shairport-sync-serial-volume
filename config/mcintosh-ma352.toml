# Volume bridge configuration for a McIntosh MA352 integrated amplifier
# (protocol: "MA352 External Control", Rev A).
#
# Use it in place of volume-bridge.toml, e.g. in docker-compose.yaml:
#   - ./config/mcintosh-ma352.toml:/etc/volume-bridge.toml:ro
#
# Wiring: the MA352's RS232 jack is 3.5 mm TRS (tip = TXD from the amp,
# ring = RXD into the amp, sleeve = ground). Configure the serial server /
# ser2net port as 115200 baud (the amp's default; 9600..57600 are selectable
# in its setup menu), 8 data bits, no parity, 1 stop bit, no flow control,
# raw TCP mode.
#
# Protocol summary: every message is ASCII wrapped in parentheses, e.g.
# "(VOL 65)", optionally followed by CR LF. The amp echoes each command it
# accepts as an acknowledgement, answers errors with "(ERROR – ...)", and with
# status enabled ("(STA 1)") pushes updates when the knob or remote is used.
# Volume is 0..100 %, mute is "(MUT 1)"/"(MUT 0)". While the amp is in standby
# it rejects everything except power commands, so the bridge can't change
# volume until the amp is on.

[bridge]
log_level = "INFO"            # DEBUG shows every message to/from the amp
source_echo_window = 1.5
amplifier_echo_window = 1.0
max_echo_window = 10.0
# AirPlay slider at the bottom = MUT 1; muting on the amp mutes the source.
use_amplifier_mute = true

[shairport]
bus = "system"
service = "org.gnome.ShairportSync"
# UDP port for Shairport Sync's metadata (metadata.socket_port in
# shairport-sync.conf); tells the bridge when a source connects/disconnects.
metadata_port = 5555

[amplifier]
type = "tcp-serial"

[amplifier.scale]
min_level = 0
max_level = 100
step = 1                      # the MA352 sets volume in 1 % steps
# Safety ceiling: never command more than this from AirPlay. Note that the top
# of the slider then all maps to this level.
# limit = 80
# 1.0 maps the AirPlay slider linearly onto 0..100 %. If the low end feels too
# coarse, try 1.5-2.0 for finer control at low volume.
exponent = 1.0

[amplifier.options]
host = "192.168.1.50"         # serial server / ser2net address
port = 4001                   # its TCP port for the MA352's RS232 line

# "(...)" framing. Anything outside the parentheses (the optional CR LF) is skipped.
framing = "markers"
start_marker = "("
end_marker = ")"
# Error messages contain an en dash; decode leniently instead of as strict ASCII.
encoding = "latin-1"

# Commands: (VOL 0..100), (MUT 1|0).
command_prefix = "("
command_suffix = ")"
set_level_command = "VOL {level_int}"
mute_on_command = "MUT 1"
mute_off_command = "MUT 0"
# Sent on every (re)connect and poll: turn on automatic status updates, then
# ask for the current volume and mute state.
query_commands = ["STA 1", "VOL", "MUT"]

# Status: the amp's acknowledgements, query replies and pushed updates all
# look like "(VOL 65)" / "(MUT 1)". "(VOL U)", "(VOL D)", "(PWR 1)", "(ERROR …)",
# and the power-on banner don't match and are ignored.
level_pattern = 'VOL\s*(?P<level>\d{1,3})'
mute_pattern = 'MUT\s*(?P<muted>[01])'
mute_on_values = ["1"]
match = "full"

# Status is pushed, so polling is only a safety net: it resends "(STA 1)" in
# case another program on a shared port turned status updates off, and it
# catches anything missed (e.g. the amp being power-cycled).
poll_interval = 60
command_interval = 0.05

# Serial multiplexer: set to true if the multiplexer echoes our own commands
# back to us. The amp's own acknowledgement is still used either way.
own_commands_echoed = false
# Other programs' "(VOL nn)" commands look exactly like status. They aren't
# ignored: the amp acknowledges them with the same message anyway.
ignore_patterns = []

# Wake the amp when a source connects. In standby the MA352 rejects every
# command except power, so turn it on, wait until it has warmed up (15-20 s),
# then re-read its state (re-enabling status updates) and bring it to the
# source's volume. Volume changes made during the warm-up are rejected by the
# amp; the sync at the end catches up with the source.
#
# At the same time, a Home Assistant webhook (an automation with a Webhook
# trigger, ID "airplay-living-room") can switch on whatever else is needed:
# speakers, a subwoofer, lights. Its JSON body tells the automation which event
# happened ({{ trigger.json.event }}: "connect" / "disconnect").
#
# Optionally put everything back to standby when the last source disconnects.
# See config/volume-bridge.toml for every hook event and action.
# [hooks]
# on_connect = [
#   { parallel = [
#     [ { send = "PWR 1" }, { delay = 20 }, { sync = "source" } ],
#     { shell = 'curl -sf -m 10 -X POST -H "Content-Type: application/json" -d "{\"event\": \"$VOLUME_BRIDGE_EVENT\", \"source\": \"$VOLUME_BRIDGE_SOURCE\"}" http://192.168.1.10:8123/api/webhook/airplay-living-room' },
#   ] },
# ]
# on_disconnect = [
#   { parallel = [
#     { send = "PWR 0" },
#     { shell = 'curl -sf -m 10 -X POST -H "Content-Type: application/json" -d "{\"event\": \"$VOLUME_BRIDGE_EVENT\", \"source\": \"$VOLUME_BRIDGE_SOURCE\"}" http://192.168.1.10:8123/api/webhook/airplay-living-room' },
#   ] },
# ]
