services:
  shairport-sync:
    build: .
    image: shairport-sync-serial-volume
    container_name: shairport-sync
    restart: unless-stopped
    # AirPlay 2 needs mDNS, PTP (UDP 319/320) and dynamic RTP ports: use host networking.
    network_mode: host
    # Sound devices are bind-mounted (not passed with "devices:", which copies the
    # device nodes once at start) so a USB DAC that disappears and reappears --
    # turned off, switched to another input -- is visible again without a
    # restart. The cgroup rule allows access to ALSA devices (major 116).
    # Use a card name, e.g. ALSA_DEVICE: "hw:CARD=N05XD", not a number, which
    # can change when the card reappears.
    device_cgroup_rules:
      - "c 116:* rmw"
    environment:
      SPS_NAME: "Living Room"
      ALSA_DEVICE: "hw:0"
      # Force a sample format instead of the deepest one the device offers
      # ("cat /proc/asound/cardN/stream0" lists them), e.g. for a DAC whose
      # 32-bit USB mode doesn't work:
      # ALSA_OUTPUT_FORMAT: "S24_3LE"
      # Seconds to wait at playback start for a DAC that isn't there yet
      # (e.g. a USB DAC still starting up). Default 30.
      # ALSA_DEVICE_WAIT: "30"
      # Debugging: Shairport Sync's sync statistics every few seconds (sync
      # error, drift corrections in PPM, minimum DAC queue = underruns), and its
      # debug messages (1-3, more verbose).
      # SHAIRPORT_STATISTICS: "1"
      # SHAIRPORT_LOG_VERBOSITY: "1"
      # Set to 0 if the host already runs avahi-daemon / nqptp.
      ENABLE_AVAHI: "1"
      ENABLE_NQPTP: "1"
      # Optional ser2net (off by default; "1" to enable): shares the amplifier's
      # serial port -- or a network serial server that accepts only one client --
      # between the volume bridge and other programs. Set it up in
      # config/ser2net.yaml and point the bridge at host 127.0.0.1, port 4001.
      ENABLE_SER2NET: "0"
    volumes:
      - /dev/snd:/dev/snd
      - ./config/shairport-sync.conf:/etc/shairport-sync.conf:ro
      - ./config/volume-bridge.toml:/etc/volume-bridge.toml:ro
      - ./config/ser2net.yaml:/etc/ser2net/ser2net.yaml:ro
      # Custom amplifier backends: put modules here and use type = "my_amp:MyAmplifier".
      # - ./amplifiers:/opt/amplifiers:ro
    # environment entry to go with the mount above:
    #   PYTHONPATH: /opt/amplifiers
      # Scripts for [hooks] shell actions, e.g. shell = "/opt/hooks/wake.sh".
      # - ./hooks:/opt/hooks:ro
    # Secrets for hook commands go in the environment, e.g.:
    #   HA_TOKEN: "<Home Assistant long-lived access token>"
    # A USB-RS232 adapter for ser2net (connector: serialdev,/dev/amp-serial,...).
    # Use its stable /dev/serial/by-id name; after replugging it, restart the
    # container.
    # devices:
    #   - /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXXXXXX-if00-port0:/dev/amp-serial
    logging:
      options:
        max-size: "10m"
